{% if user.is_authenticated %}
<li class="nav-item">
  <form action="{% url 'pages:logout' %}" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="nav-link btn btn-link" style="padding:0;">Logout</button>
  </form>
</li>
{% else %}
<li class="nav-item">
  <a class="nav-link" href="{% url 'pages:login' %}">Login</a>
</li>
{% endif %}
